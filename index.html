<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>写了吗</title>

<!-- iOS PWA 支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="写了吗">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f6f8">

<!-- iOS 桌面图标 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#222;
  --text-secondary:#666;
  --border:#ddd;
  --day-done-bg:#c6efce;
  --day-done-text:#006400;
  --day-wanna-bg:#ffcece;
  --day-wanna-text:#990000;
  --day-future:#eee;
}
.dark{
  --bg:#1a1a1a;
  --card:#282828;
  --text:#eee;
  --text-secondary:#aaa;
  --border:#444;
  --day-done-bg:#1b4b24;
  --day-done-text:#89e894;
  --day-wanna-bg:#5c2020;
  --day-wanna-text:#ffaaaa;
  --day-future:#333;
}
html, body {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
body{
  background:var(--bg);
  color:var(--text);
  padding:20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  max-width:700px;
  margin:0 auto;
  transition:background 0.3s,color 0.3s;
  min-height:100vh;
}
.header{text-align:center;margin-bottom:24px;position:relative;}
h1{font-size:32px;color:var(--text);margin-bottom:6px;}
.subtitle{font-size:18px;color:var(--text-secondary);margin-bottom:20px;}
#toggleDark{position:absolute;top:0;right:0;border:none;background:transparent;font-size:24px;cursor:pointer;padding:8px;}

/* 月份切换栏 */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.month-nav button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--text);}
.month-nav button:active{filter:brightness(0.9);}
.month-nav button:disabled{opacity:0.3;cursor:not-allowed;}
.month-title{font-size:20px;font-weight:bold;}

.stat-wrap{background:var(--card);padding:16px;border-radius:12px;margin-bottom:20px;border:1px solid var(--border);}
.stat-title{font-weight:bold;margin-bottom:8px;font-size:17px;}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;font-size:16px;}
.export-btn{margin-top:12px;padding:8px 14px;font-size:14px;background:#5271ff;color:#fff;border-radius:8px;flex:none;}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px;}
.day-item{padding:12px 4px;text-align:center;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;user-select:none;font-size:15px;}
.day-item:active{filter:brightness(0.9);}
.day-done{background:var(--day-done-bg);color:var(--day-done-text);border-color:#8fdf99;}
.day-wanna{background:var(--day-wanna-bg);color:var(--day-wanna-text);border-color:#ffaaaa;}
.day-future{opacity:0.4;background:var(--day-future);cursor:not-allowed;}
.day-header{font-weight:bold;color:var(--text-secondary);cursor:default;}
.day-header:active{filter:none;}

.tip-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:99;}
.tip-box{background:var(--card);padding:30px 24px;border-radius:16px;max-width:420px;text-align:center;font-size:18px;line-height:1.7;color:var(--text);}
.tip-box button{margin-top:18px;padding:10px 24px;font-size:16px;flex:none;}

/* 日期选择弹窗 */
.edit-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
.edit-box{background:var(--card);padding:24px;border-radius:16px;max-width:360px;text-align:center;color:var(--text);}
.edit-box h3{margin-bottom:16px;}
.edit-buttons{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
.edit-buttons button{padding:14px;border-radius:10px;font-size:17px;font-weight:bold;border:none;cursor:pointer;}
.btn-wanna{background:#ffc864;color:#222;}
.btn-done{background:#42b983;color:#fff;}
.btn-delete{background:#ff6b6b;color:#fff;}
.btn-cancel{background:#888;color:#fff;}

.longpress-tip{text-align:center;font-size:13px;color:var(--text-secondary);margin-top:8px;}
</style>
</head>
<body>
<div class="header">
<button id="toggleDark">🌓</button>
<h1>写了吗</h1>
<div class="subtitle">准备给学术圈一点小小的震撼</div>
</div>

<div class="stat-wrap">
<div class="stat-title">📊 本月统计</div>
<div class="stat-row">
<div>✅ 已写：<span id="cntDone">0</span> 天</div>
<div>😮‍💨 想写来着：<span id="cntWanna">0</span> 天</div>
</div>
<button class="export-btn" id="exportBtn">导出本月记录</button>
</div>

<!-- 月份切换 -->
<div class="month-nav">
<button id="prevMonth">← 上月</button>
<div class="month-title" id="monthTitle"></div>
<button id="nextMonth">下月 →</button>
</div>

<div class="calendar" id="calendarBox"></div>
<div class="longpress-tip">💡 长按某天可删除该天记录</div>

<!-- 提示弹窗 -->
<div class="tip-modal" id="modal">
<div class="tip-box">
<div id="msgText"></div>
<button onclick="closeModal()">收到</button>
</div>
</div>

<!-- 日期选择弹窗 -->
<div class="edit-modal" id="editModal">
<div class="edit-box">
<h3 id="editDayTitle"></h3>
<div class="edit-buttons">
<button class="btn-done" id="editDone">真的写了</button>
<button class="btn-wanna" id="editWanna">想写来着</button>
<button class="btn-delete" id="editDelete">删除记录</button>
<button class="btn-cancel" onclick="closeEditModal()">取消</button>
</div>
</div>
</div>

<script>
// 阴阳文案库
const wannaTexts = [
    "院士还评不评啦！你已经是这个领域的专家了！",
    "没事，夜班那么累，文献哪有病人香，先放一放。",
    "课题不急，反正明年申报，还有大把的摸鱼时光。",
    "别焦虑，大家都没动笔，你不是一个人在拖延。",
    "灵感会在凌晨三点查房的时候自动浮现，再等等。",
    "只是暂时搁置，不是放弃，学术大业来日方长。",
    "临床已经够辛苦了，写东西这种小事，随缘就好。",
    "先休息，等忙完这一波，一定坐下来好好构思。",
    "脑子里面框架都有了，只差动手敲字而已。",
    "审稿人又不会催你，何必为难辛苦的自己。",
    "想法千千万，落笔最难，拖延是科研人的天赋。",
    "今晚先好好睡觉，写作这种大事明天再说。",
    "病历已经写到手软，论文这种精神内耗先暂停。",
    "临床大牛哪个不是厚积薄发，晚一点动笔怎么了。",
    "数据都躺在硬盘里，它会乖乖等你有空再来宠幸。",
    "申报书截止日期还很远，现在动笔属于过早透支。",
    "今天先保命，科研这种事情留给精力充沛的明天。",
    "不是不写，是在沉淀，酝酿惊世骇俗的大作。",
    "医院的活已经填满24小时，别苛责自己还要产出。",
    "别人卷任别人卷，你先稳住临床，写作随缘。",
    "思路已经成型，只差一个万籁俱寂的夜晚落笔。",
    "审稿人看多了急稿，说不定更喜欢慢工出细活。"
];
const doneTexts = [
    "你距离诺贝尔奖又进一步！",
    "太棒了！审稿人已经开始期待你的大作！",
    "笔耕不辍，下一个青年拔尖人才就是你！",
    "临床科研两手抓，主任看了都要夸一句厉害！",
    "今日产出已达标，学术高楼又添一块砖！",
    "坚持下去，未来你的论文会被疯狂引用！",
    "别人在休息，你在耕耘，差距正在悄悄拉开！",
    "这一笔记录，是你晋升路上坚实的垫脚石！",
    "科研之路步步前行，每一次动笔都算数！",
    "继续保持，几年后你的名字写进指南里！",
    "今日的文字，就是未来答辩台上的底气！",
    "积少成多，量变马上就要触发质变了！",
    "夜班间隙还能产出，科研卷王非你莫属！",
    "病历论文双线作战，你正在悄悄惊艳科室！",
    "这篇写好，下次基金申报底气直接拉满！",
    "每敲下一段文字，学术履历就厚重一分！",
    "坚持住，未来评职称时这段记录闪闪发光！",
    "别人下班躺平，你悄悄码字，赢麻了！",
    "数据+文字完美落地，属于你的成果正在诞生！",
    "持续输出，未来会有后辈引用你的文章！",
    "临床的积累化为文字，这才是医者的终极浪漫！",
    "今日的伏案，终会变成简历上亮眼的一笔！"
];

const modal = document.getElementById('modal');
const msgText = document.getElementById('msgText');
const editModal = document.getElementById('editModal');
const editDayTitle = document.getElementById('editDayTitle');
let editTargetDay = null;

// 当前正在浏览的年月
let viewYear, viewMonth;
const now = new Date();
viewYear = now.getFullYear();
viewMonth = now.getMonth();

// 限制范围：最早2020年1月，最晚2056年6月
const MIN_Y = 2020, MIN_M = 0;
const MAX_Y = 2056, MAX_M = 5;

function showModal(text){
    msgText.innerText = text;
    modal.style.display = 'flex';
}
function closeModal(){
    modal.style.display = 'none';
}
function openEditModal(day){
    editTargetDay = day;
    editDayTitle.innerText = `${viewYear}年${viewMonth+1}月${day}日`;
    editModal.style.display = 'flex';
}
function closeEditModal(){
    editModal.style.display = 'none';
    editTargetDay = null;
}

const STORAGE_KEY = 'doctor_write_record';
function getRecords(){
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
}
function saveRecord(y,m,day,status){
    const key = `${y}-${m}`;
    const records = getRecords();
    if(!records[key]) records[key] = {};
    if(status === null){
        delete records[key][day];
    }else{
        records[key][day] = status;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

// 统计当前浏览月份
function calcStat(){
    const key = `${viewYear}-${viewMonth}`;
    const records = getRecords();
    const monthData = records[key] || {};
    let cntDone = 0, cntWanna = 0;
    Object.values(monthData).forEach(s=>{
        if(s === 'done') cntDone++;
        if(s === 'wanna') cntWanna++;
    })
    document.getElementById('cntDone').innerText = cntDone;
    document.getElementById('cntWanna').innerText = cntWanna;
}

// 导出本月记录
document.getElementById('exportBtn').onclick = function(){
    const key = `${viewYear}-${viewMonth}`;
    const records = getRecords();
    const monthData = records[key] || {};
    const exportObj = {
        year: viewYear,
        month: viewMonth+1,
        data: monthData
    };
    const jsonStr = JSON.stringify(exportObj,null,2);
    const blob = new Blob([jsonStr],{type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `写了吗_打卡记录_${viewYear}年${viewMonth+1}月.txt`;
    a.click();
    URL.revokeObjectURL(url);
}

// 渲染月历
function renderCalendar(){
    document.getElementById('monthTitle').innerText = `${viewYear}年${viewMonth+1}月`;
    const box = document.getElementById('calendarBox');
    box.innerHTML = "";

    // 更新月份按钮状态
    document.getElementById('prevMonth').disabled = (viewYear === MIN_Y && viewMonth === MIN_M);
    document.getElementById('nextMonth').disabled = (viewYear === MAX_Y && viewMonth === MAX_M);

    const weekTxt = ["日","一","二","三","四","五","六"];
    weekTxt.forEach(w=>{
        const div = document.createElement('div');
        div.className = "day-item day-header";
        div.innerText = w;
        box.appendChild(div);
    })

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const totalDays = new Date(viewYear, viewMonth+1, 0).getDate();

    // 判断当前浏览月是不是未来的月（不允许打卡）
    const nowDate = new Date();
    const curY = nowDate.getFullYear();
    const curM = nowDate.getMonth();
    const curD = nowDate.getDate();
    const isFutureMonth = (viewYear > curY) || (viewYear === curY && viewMonth > curM);

    const records = getRecords();
    const monthData = records[`${viewYear}-${viewMonth}`] || {};

    // 月初空白
    for(let i=0;i<firstDay;i++){
        const div = document.createElement('div');
        div.className = "day-item";
        box.appendChild(div);
    }

    for(let d=1; d<=totalDays; d++){
        const div = document.createElement('div');
        div.className = "day-item";
        div.innerText = d;

        // 判断是否未来日期（不能打卡）
        const isFuture = isFutureMonth || (viewYear === curY && viewMonth === curM && d > curD);

        if(isFuture){
            div.classList.add('day-future');
        }else{
            const stat = monthData[d];
            if(stat === 'done') div.classList.add('day-done');
            if(stat === 'wanna') div.classList.add('day-wanna');

            // 单击打开弹窗
            div.onclick = () => openEditModal(d);

            // 长按删除
            let pressTimer;
            div.addEventListener('touchstart', ()=>{
                pressTimer = setTimeout(()=>{
                    if(monthData[d]){
                        if(confirm(`删除 ${viewMonth+1}月${d}日 的记录？`)){
                            saveRecord(viewYear, viewMonth, d, null);
                            showModal("已删除记录，当作没发生过吧。");
                            renderCalendar();
                        }
                    }
                }, 600);
            });
            div.addEventListener('touchend', ()=> clearTimeout(pressTimer));
            div.addEventListener('touchmove', ()=> clearTimeout(pressTimer));
            // 桌面端右键也能删
            div.addEventListener('contextmenu', (e)=>{
                e.preventDefault();
                if(monthData[d]){
                    if(confirm(`删除 ${viewMonth+1}月${d}日 的记录？`)){
                        saveRecord(viewYear, viewMonth, d, null);
                        showModal("已删除记录，当作没发生过吧。");
                        renderCalendar();
                    }
                }
            });
        }
        box.appendChild(div);
    }
    calcStat();
}

// 月份切换
document.getElementById('prevMonth').onclick = function(){
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
};
document.getElementById('nextMonth').onclick = function(){
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
};

// 弹窗里的按钮
document.getElementById('editDone').onclick = function(){
    if(editTargetDay === null) return;
    saveRecord(viewYear, viewMonth, editTargetDay, 'done');
    const randomTxt = doneTexts[Math.floor(Math.random() * doneTexts.length)];
    closeEditModal();
    showModal(randomTxt);
    renderCalendar();
}
document.getElementById('editWanna').onclick = function(){
    if(editTargetDay === null) return;
    saveRecord(viewYear, viewMonth, editTargetDay, 'wanna');
    const randomTxt = wannaTexts[Math.floor(Math.random() * wannaTexts.length)];
    closeEditModal();
    showModal(randomTxt);
    renderCalendar();
}
document.getElementById('editDelete').onclick = function(){
    if(editTargetDay === null) return;
    saveRecord(viewYear, viewMonth, editTargetDay, null);
    closeEditModal();
    showModal("已删除记录，当作没发生过吧。");
    renderCalendar();
}

// 深色模式
const toggleDark = document.getElementById('toggleDark');
toggleDark.onclick = function(){
    document.body.classList.toggle('dark');
    localStorage.setItem('writeDark', document.body.classList.contains('dark'));
}
if(localStorage.getItem('writeDark') === 'true'){
    document.body.classList.add('dark');
}

renderCalendar();
</script>
</body>
</html>
